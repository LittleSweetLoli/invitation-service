version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       invitations
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invitations"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/invitations?sslmode=disable
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pg_data:
